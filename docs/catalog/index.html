<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<title>レオパ卸リスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* layout: header band, then a responsive card grid (1 column on phones, up to 5 on wide screens); photos open in a viewer */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --band:#E8F5FC; --sunk:#F0F8FD; --ink:#14303F; --muted:#5C7685; --line:#D6E9F3;
  --accent:#36A9DE; --accent-soft:#DDF1FB; --ok:#23805A; --ok-soft:#DCF2E8; --scrim:rgba(10,30,45,.82);
  --f-display:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1A22; --surface:#13242F; --band:#11303F; --sunk:#182E3B; --ink:#E5F2F8; --muted:#8EAAB9; --line:#22394A;
  --accent:#5CC3EF; --accent-soft:#163E52; --ok:#6CCB9C; --ok-soft:#15352A; --scrim:rgba(0,0,0,.88); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1A22; --surface:#13242F; --band:#11303F; --sunk:#182E3B; --ink:#E5F2F8; --muted:#8EAAB9; --line:#22394A;
  --accent:#5CC3EF; --accent-soft:#163E52; --ok:#6CCB9C; --ok-soft:#15352A; --scrim:rgba(0,0,0,.88); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band{background:var(--band);border-bottom:1px solid var(--line)}
.wrap{max-width:1240px;margin:0 auto}
header .wrap{padding-block:22px 18px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,4vw,30px);margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.sub b{font-family:var(--f-mono);color:var(--ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap;padding-block:14px}
.tools input,.tools select{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface);font-size:16px;min-width:0}
.tools input{flex:1 1 220px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main .wrap{padding-block:6px 48px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.photo{aspect-ratio:4/3;background:var(--sunk);display:grid;place-items:center;color:var(--muted);font-size:13px;border:0;padding:0;width:100%;cursor:zoom-in;max-width:100%}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo.none{cursor:default}
.count-badge{position:relative}
.count-badge span{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font:600 12px var(--f-mono);padding:2px 8px;border-radius:999px}
.body{padding:11px 13px 13px;display:flex;flex-direction:column;gap:3px;flex:1}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.id{font-family:var(--f-mono);font-weight:700;font-size:19px}
.sex{font-size:13px;color:var(--muted);white-space:nowrap}
.morph{font-weight:700;font-size:15.5px;line-height:1.35;overflow-wrap:anywhere}
.en{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.foot{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:auto;padding-top:10px;font-size:12.5px;color:var(--muted)}
.price{font-family:var(--f-mono);font-size:19px;font-weight:600;color:var(--ink);white-space:nowrap}
.price.ask{font-family:var(--f-body);font-size:12.5px;font-weight:600}
.empty{padding:48px 20px;text-align:center;color:var(--muted);background:var(--sunk);border:1px dashed var(--line);border-radius:14px}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:17px;margin-bottom:4px}
footer{color:var(--muted);font-size:12px;text-align:center;padding-block:0 32px}
.viewer{position:fixed;inset:0;background:var(--scrim);z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.viewer img{max-width:100%;max-height:78vh;border-radius:10px;display:block}
.viewer .bar{display:flex;gap:10px;align-items:center;color:#fff;font:600 14px var(--f-mono)}
.viewer button{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;min-width:44px;height:44px;padding:0 14px;font-size:16px;cursor:pointer}
.note{font-size:12.5px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:4px}
.add{margin-top:10px;border:1px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:10px;padding:8px 10px;font-weight:700;cursor:pointer;min-height:40px}
.add[aria-pressed="true"]{background:var(--accent);color:#fff}
.card.incart{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
body.hascart main .wrap{padding-bottom:110px}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.08);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.cartbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cartbar b{font-family:var(--f-mono);font-size:17px}
.cartbar .sum{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.cartbar .ask{font-size:11.5px;color:var(--muted)}
.cartbar .btn{white-space:nowrap;flex:none}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.cart{position:fixed;inset:0;z-index:8;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.cart .panel{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.cart h2{margin:0;font-family:var(--f-display);font-size:20px;display:flex;justify-content:space-between;align-items:center}
.cart .line{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.cart .line .no{font:700 14px var(--f-mono)}
.cart .line .m{overflow-wrap:anywhere;font-size:14px}
.cart .line .p{font:600 15px var(--f-mono);white-space:nowrap}
.cart .x{border:0;background:none;color:var(--muted);font-size:20px;min-width:36px;min-height:36px;cursor:pointer}
.cart .total{display:flex;justify-content:space-between;font-weight:700;font-size:16px}
.cart .total b{font-family:var(--f-mono);font-size:20px}
.cart label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.cart input,.cart textarea{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface);font-size:16px;font-family:inherit;color:var(--ink)}
.cart .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cart .hint{font-size:12.5px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:20;white-space:nowrap}
/* list view (default): a small photo on the left, everything a buyer compares on the right, one gecko per row */
.bar2{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:10px}
.count{font-size:13px;color:var(--muted)}
.rows{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:760px){.rows{grid-template-columns:1fr 1fr}}
@media (min-width:1180px){.rows{grid-template-columns:1fr 1fr 1fr}}
.item{display:grid;grid-template-columns:112px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0}
.item.incart{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.thumb{width:112px;height:112px;border-radius:10px;overflow:hidden;background:var(--sunk);border:0;padding:0;position:relative;cursor:zoom-in;display:grid;place-items:center;color:var(--muted);font-size:11.5px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb span{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.6);color:#fff;font:600 11px var(--f-mono);padding:1px 6px;border-radius:999px}
.thumb.none{cursor:default}
.info{display:flex;flex-direction:column;gap:3px;min-width:0}
.line1{display:flex;align-items:center;gap:8px}
.no{font:700 16px var(--f-mono)}
.sx{font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;background:var(--sunk);color:var(--muted)}
.sx.m{background:#E2F0FF;color:#1F5FA8}.sx.f{background:#FDE7EF;color:#B03566}
.name{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.35;overflow-wrap:anywhere}
.het{font-size:13px;color:var(--ink);opacity:.8;overflow-wrap:anywhere}
.meta{font-size:12.5px;color:var(--muted)}
.memo{margin-top:4px;background:var(--memo);color:var(--memo-ink);border-radius:8px;padding:5px 9px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.memo b{font-size:11.5px;margin-right:6px}
.line3{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:6px}
.line3 .price{font-size:20px}
.line3 .add{margin-top:0;min-height:38px;padding:6px 12px;font-size:13px;white-space:nowrap}
:root{--memo:#FFF4D6;--memo-ink:#6A4B00}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--memo:#3A2F12;--memo-ink:#F3DFA6}.sx.m{background:#16324F;color:#9CC8F5}.sx.f{background:#45202F;color:#F2A9C4}}
@media (max-width:380px){.item{grid-template-columns:92px minmax(0,1fr)}.thumb{width:92px;height:92px}}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s ease}.card:hover{transform:translateY(-2px)}}
</style>

</head>
<body>
<header class="band gut"><div class="wrap">
  <div><h1 id="title">卸リスト</h1><p class="sub" id="sub">読み込み中…</p></div>
</div></header>
<main class="gut"><div class="wrap">
  <div class="tools">
    <input id="q" type="search" placeholder="モルフや番号で探す" aria-label="モルフや番号で探す" autocomplete="off">
    <select id="sort" aria-label="並び順">
      <option value="no">番号順</option>
      <option value="morph">モルフ順</option>
      <option value="young">若い順</option>
      <option value="old">月齢が高い順</option>
      <option value="cheap">価格が安い順</option>
      <option value="high">価格が高い順</option>
    </select>
  </div>
  <div class="chips" id="sexes" role="group" aria-label="性別"></div>
  <div class="bar2"><span class="count" id="count"></span></div>
  <div id="list"></div>
</div></main>
<footer class="gut">掲載内容は更新時点のものです。在庫状況はお問い合わせください。</footer>
<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="写真"></div>
<div class="cartbar" id="cartbar" hidden><div class="wrap"><span class="sum"><span>カート <b id="cb-n">0</b>頭 · <b id="cb-sum"></b></span><span class="ask" id="cb-ask" hidden>価格お問い合わせの個体を含みます</span></span><button class="btn primary" data-c="open">カートを見る</button></div></div>
<div class="cart" id="cart" hidden role="dialog" aria-modal="true" aria-label="カート"></div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const yen = n => n == null ? "価格はお問い合わせ" : "¥" + Number(n).toLocaleString("ja-JP");
const monthsOld = b => { if (!b) return null; const d = (Date.now() - new Date(b + "T00:00:00")) / 864e5; return d < 0 ? null : Math.floor(d / 30.44); };
const ageText = b => { const m = monthsOld(b); return m == null ? "" : m < 1 ? "生後" + Math.max(0, Math.round((Date.now() - new Date(b + "T00:00:00")) / 864e5)) + "日" : m < 24 ? m + "か月" : Math.floor(m / 12) + "歳"; };
const sexText = s => s === "♂" ? "♂ オス" : s === "♀" ? "♀ メス" : "性別未判定";
let data = { title: "卸リスト", items: [] }, sexF = "";
function render() {
  const q = $("#q").value.normalize("NFKC").toLowerCase().trim(), sort = $("#sort").value;
  const qn = q.replace(/^no\.?\s*/, "");
  let items = data.items.filter(x => (!sexF || (sexF === "?" ? !["♂", "♀"].includes(x.sex) : x.sex === sexF)) && (!q || String(x.wno) === qn || [x.morph, x.morphEn, x.het, x.note].join(" ").normalize("NFKC").toLowerCase().includes(q)));
  const cmp = {
    no: (a, b) => (a.wno ?? 0) - (b.wno ?? 0),
    morph: (a, b) => String(a.morph).localeCompare(String(b.morph), "ja") || a.id.localeCompare(b.id),
    young: (a, b) => String(b.birthDate || "").localeCompare(String(a.birthDate || "")),
    old: (a, b) => String(a.birthDate || "9").localeCompare(String(b.birthDate || "9")),
    cheap: (a, b) => (a.price ?? 1e12) - (b.price ?? 1e12),
    high: (a, b) => (b.price ?? -1) - (a.price ?? -1),
  }[sort];
  items = items.slice().sort(cmp);
  $("#count").textContent = data.items.length ? items.length + "頭を表示" : "";
  const born = x => x.birthDate ? (/^\d{4}$/.test(x.birthDate) ? x.birthDate + "年" : x.birthDate.replace(/-/g, ".")) + " 生まれ" + (ageText(x.birthDate) && !/^\d{4}$/.test(x.birthDate) ? "（" + ageText(x.birthDate) + "）" : "") : "";
  $("#list").innerHTML = !data.items.length
    ? `<div class="empty"><b>現在掲載している個体はありません</b>入荷しだい掲載します。</div>`
    : !items.length ? `<div class="empty"><b>条件に合う個体はいません</b>検索や性別の絞り込みを変えてみてください。</div>`
    : `<div class="rows">${items.map(x => {
        const ph = x.photos || [], inCart = cart.includes(x.wno), sx = x.sex === "♂" ? "m" : x.sex === "♀" ? "f" : "";
        return `<article class="item${inCart ? " incart" : ""}">
          ${ph.length ? `<button class="thumb" data-ph="${esc(x.wno)}" aria-label="No.${esc(x.wno)} の写真を見る"><img src="${esc(ph[0])}" alt="No.${esc(x.wno)} ${esc(x.morph)}" loading="lazy">${ph.length > 1 ? `<span>${ph.length}枚</span>` : ""}</button>` : `<div class="thumb none">写真準備中</div>`}
          <div class="info">
            <div class="line1"><span class="no">No.${esc(x.wno ?? "")}</span><span class="sx ${sx}">${esc(sexText(x.sex))}</span></div>
            <div class="name">${esc(x.morph || "モルフ未記入")}</div>
            ${x.het ? `<div class="het">${esc(x.het)}</div>` : ""}
            ${born(x) ? `<div class="meta">${esc(born(x))}</div>` : ""}
            ${x.note ? `<div class="memo"><b>備考</b>${esc(x.note)}</div>` : ""}
            <div class="line3"><span class="price${x.price == null ? " ask" : ""}">${esc(yen(x.price))}</span><button class="add" data-add="${esc(x.wno)}" aria-pressed="${inCart}">${inCart ? "✓ カート内" : "カートに入れる"}</button></div>
          </div></article>`;
      }).join("")}</div>`;
}
function renderSexes() {
  const has = s => data.items.some(x => s === "?" ? !["♂", "♀"].includes(x.sex) : x.sex === s);
  const opts = [["", "すべて"], ["♂", "♂ オス"], ["♀", "♀ メス"], ["?", "未判定"]].filter(([k]) => !k || has(k));
  $("#sexes").innerHTML = opts.length > 2 ? opts.map(([k, l]) => `<button class="chip" data-sex="${k}" aria-pressed="${sexF === k}">${l}</button>`).join("") : "";
}
/* ---- cart: kept in this browser only; the order goes out as text the buyer copies or sends by LINE ----
   it remembers each gecko by list number and morph, so a renumbered or sold gecko simply drops out */
const CART_KEY = "bm-cart-" + location.pathname;
let cart = [], who = "";
try { const c = JSON.parse(localStorage.getItem(CART_KEY) || "{}"); cart = c.items || []; who = c.who || ""; } catch {}
const cartKeyOf = x => x.wno + "|" + x.morph;
let cartKeys = [];
try { cartKeys = JSON.parse(localStorage.getItem(CART_KEY) || "{}").keys || []; } catch {}
function saveCart() { try { localStorage.setItem(CART_KEY, JSON.stringify({ items: cart, keys: cartItems().map(cartKeyOf), who })); } catch {} }
const cartItems = () => cart.map(n => data.items.find(x => x.wno === n)).filter(Boolean);
const cartSum = () => cartItems().reduce((s, x) => s + (x.price ?? 0), 0);
const cartAsk = () => cartItems().some(x => x.price == null);
function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 2200); }
function renderBar() {
  const n = cartItems().length;
  $("#cartbar").hidden = !n; document.body.classList.toggle("hascart", !!n);
  $("#cb-n").textContent = n; $("#cb-sum").textContent = yen(cartSum()); $("#cb-ask").hidden = !cartAsk();
}
function orderText() {
  const it = cartItems().slice().sort((a, b) => a.wno - b.wno), note = ($("#c-note")?.value || "").trim();
  return [`【${data.title || "卸リスト"} 注文】`, who ? "お名前: " + who : "", "",
    ...it.map(x => [`No.${x.wno}`, x.sex, x.morph, x.het].filter(Boolean).join(" ") + "  " + yen(x.price)), "",
    `合計 ${it.length}頭 ${yen(cartSum())}${cartAsk() ? "（価格お問い合わせの個体を除く）" : ""}`, note ? "\n備考: " + note : "",
    /* the seller's app reads this line back into the geckos ordered; it means nothing to anyone else */
    it.some(x => x.ref) ? "\n―― 出品者の管理用コード（消さずに送ってください）――\nBMO1." + it.map(x => String(x.ref || "").replace(/^BMQ1/, "") || "-").join(".") : ""].join("\n").replace(/\n{3,}/g, "\n\n").trim();
}
function showCart() {
  const it = cartItems().slice().sort((a, b) => a.wno - b.wno), c = $("#cart");
  if (!it.length) { c.hidden = true; renderBar(); return; }
  const keepNote = $("#c-note")?.value || "";
  c.innerHTML = `<div class="panel"><h2>カート（${it.length}頭）<button class="x" data-c="close" aria-label="閉じる">×</button></h2>
    <div>${it.map(x => `<div class="line"><span class="no">No.${esc(x.wno)}</span><span class="m">${esc(x.sex || "")} ${esc(x.morph || "—")}${x.het ? `<br><span style="color:var(--muted);font-size:12.5px">${esc(x.het)}</span>` : ""}</span><span class="p">${esc(yen(x.price))}</span><button class="x" data-rm="${esc(x.wno)}" aria-label="No.${esc(x.wno)} を外す">×</button></div>`).join("")}</div>
    <div class="total"><span>合計 ${it.length}頭</span><b>${esc(yen(cartSum()))}</b></div>${cartAsk() ? `<p class="hint">価格お問い合わせの個体は合計に入っていません。</p>` : ""}
    <label>お名前・店名<input id="c-who" value="${esc(who)}" autocomplete="organization" placeholder="例 〇〇レプタイルズ"></label>
    <label>備考（任意）<textarea id="c-note" rows="2" placeholder="例 発送希望日・支払い方法など">${esc(keepNote)}</textarea></label>
    <div class="acts"><button class="btn" data-c="copy">注文内容をコピー</button><button class="btn primary" data-c="line">LINEで送る</button></div>
    <p class="hint">注文内容を文章にして、LINEやメッセージで送れます。在庫は確認のうえお返事します。</p>
    <button class="btn" data-c="clear">カートを空にする</button></div>`;
  c.hidden = false;
}
function setCart(next) { cart = next; saveCart(); render(); renderBar(); if (!$("#cart").hidden) showCart(); }
document.addEventListener("input", e => { if (e.target.id === "c-who") { who = e.target.value; saveCart(); } });
let vi = { list: [], i: 0 };
function showViewer() {
  const v = $("#viewer"), src = vi.list[vi.i];
  v.innerHTML = `<img src="${esc(src)}" alt="写真 ${vi.i + 1}"><div class="bar">${vi.list.length > 1 ? `<button data-v="prev" aria-label="前の写真">‹</button><span>${vi.i + 1} / ${vi.list.length}</span><button data-v="next" aria-label="次の写真">›</button>` : ""}<button data-v="close">閉じる</button></div>`;
  v.hidden = false;
}
document.addEventListener("click", e => {
  const ad = e.target.closest("[data-add]");
  if (ad) { const n = Number(ad.dataset.add); const on = cart.includes(n); setCart(on ? cart.filter(x => x !== n) : cart.concat(n)); if (!on) toast("No." + n + " をカートに入れました"); return; }
  const rm = e.target.closest("[data-rm]"); if (rm) { setCart(cart.filter(x => x !== Number(rm.dataset.rm))); return; }
  const cb = e.target.closest("[data-c]");
  if (cb) {
    const k = cb.dataset.c;
    if (k === "open") showCart();
    else if (k === "close") $("#cart").hidden = true;
    else if (k === "clear") { if (confirm("カートを空にしますか？")) { setCart([]); $("#cart").hidden = true; } }
    else if (k === "copy") navigator.clipboard.writeText(orderText()).then(() => toast("注文内容をコピーしました"), () => { window.prompt("この文章をコピーしてください", orderText()); });
    else if (k === "line") location.href = "https://line.me/R/share?text=" + encodeURIComponent(orderText());
    return;
  }
  if (e.target.id === "cart") { $("#cart").hidden = true; return; }
  const s = e.target.closest("[data-sex]"); if (s) { sexF = s.dataset.sex; renderSexes(); render(); return; }
  const p = e.target.closest("[data-ph]"); if (p) { const x = data.items.find(i => String(i.wno) === p.dataset.ph); vi = { list: x.photos || [], i: 0 }; showViewer(); return; }
  const v = e.target.closest("[data-v]");
  if (v) { const k = v.dataset.v; if (k === "close") $("#viewer").hidden = true; else { vi.i = (vi.i + (k === "next" ? 1 : -1) + vi.list.length) % vi.list.length; showViewer(); } return; }
  if (e.target.id === "viewer") $("#viewer").hidden = true;
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { $("#viewer").hidden = true; $("#cart").hidden = true; } });
$("#q").addEventListener("input", render);
$("#sort").addEventListener("change", render);
fetch("catalog.json", { cache: "no-store" }).then(r => r.ok ? r.json() : Promise.reject(r.status)).then(d => {
  data = { title: "卸リスト", items: [], ...d };
  document.title = (data.title || "卸リスト");
  $("#title").textContent = data.title || "卸リスト";
  $("#sub").innerHTML = `<b>${data.items.length}</b>頭掲載 · ${esc(String(data.updatedAt || "").slice(0, 10).replace(/-/g, "/"))} 更新`;
  /* only what is still listed as the same gecko stays in the cart */
  cart = cart.filter((n, i) => { const x = data.items.find(y => y.wno === n); return x && (!cartKeys.length || cartKeys.includes(cartKeyOf(x))); }); saveCart();
  renderSexes(); render(); renderBar();
}).catch(() => { $("#sub").textContent = "リストを読み込めませんでした。時間をおいて開き直してください。"; render(); });
</script>
</body>
</html>
