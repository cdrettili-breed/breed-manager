<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Breed">
<meta name="theme-color" content="#E8F5FC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Breed Manager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* layout: one-column phone shell — header / scrolling view / bottom tab bar; detail and forms rise as bottom sheets */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --band:#E8F5FC; --sunk:#F0F8FD; --ink:#14303F; --muted:#5C7685; --line:#D6E9F3;
  --accent:#36A9DE; --accent-ink:#0B4462; --accent-soft:#DDF1FB; --primary:#BEE6F8; --primary-ink:#0A3A55;
  --ok:#23805A; --ok-soft:#DCF2E8; --warn:#9A5A00; --warn-soft:#FCEBD2; --bad:#B8392D; --bad-soft:#F8E0DC;
  --info:#4B55B0; --info-soft:#E7E8F8; --off:#647A86; --off-soft:#EAF0F3; --scrim:rgba(10,30,45,.38);
  --f-display:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1A22; --surface:#13242F; --band:#11303F; --sunk:#182E3B; --ink:#E5F2F8; --muted:#8EAAB9; --line:#22394A;
  --accent:#5CC3EF; --accent-ink:#C9EEFC; --accent-soft:#163E52; --primary:#2A7AA3; --primary-ink:#F2FBFF;
  --ok:#6CCB9C; --ok-soft:#15352A; --warn:#F0AE55; --warn-soft:#3A2A12; --bad:#F28C80; --bad-soft:#3E1D19;
  --info:#A3AAF0; --info-soft:#22264A; --off:#93A8B4; --off-soft:#1E2E38; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1A22; --surface:#13242F; --band:#11303F; --sunk:#182E3B; --ink:#E5F2F8; --muted:#8EAAB9; --line:#22394A;
  --accent:#5CC3EF; --accent-ink:#C9EEFC; --accent-soft:#163E52; --primary:#2A7AA3; --primary-ink:#F2FBFF;
  --ok:#6CCB9C; --ok-soft:#15352A; --warn:#F0AE55; --warn-soft:#3A2A12; --bad:#F28C80; --bad-soft:#3E1D19;
  --info:#A3AAF0; --info-soft:#22264A; --off:#93A8B4; --off-soft:#1E2E38; --scrim:rgba(0,0,0,.6); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{background:var(--bg)}
/* budget / backup strip under the header */
.statusbar{display:flex;justify-content:center;gap:8px;padding-block:6px;border-bottom:1px solid var(--line);background:var(--bg);flex-wrap:wrap}
.spill{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12px;background:var(--surface);color:var(--ink);min-height:32px;min-width:0}
.spill svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--muted)}
.spill .lab{color:var(--muted)}
.spill .val{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.spill .mini{width:36px;height:5px;border-radius:3px;background:var(--sunk);overflow:hidden;flex:none}
.spill .mini i{display:block;height:100%;background:var(--accent);border-radius:3px}
.spill.ok .mini i{background:var(--ok)}
.spill.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.spill.warn .lab,.spill.warn svg{color:var(--warn)} .spill.warn .mini{background:rgba(0,0,0,.08)} .spill.warn .mini i{background:var(--warn)}
.spill.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.spill.bad .lab,.spill.bad svg{color:var(--bad)} .spill.bad .mini i{background:var(--bad)}
/* live QR scanner */
.scanner{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column}
.scanner video{flex:1;min-height:0;width:100%;object-fit:cover}
.scanner .frame{position:absolute;left:50%;top:42%;width:min(66vw,300px);aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
.scanner .scan-msg{position:absolute;left:0;right:0;top:calc(14px + env(safe-area-inset-top,0px));text-align:center;color:#fff;font-size:15px;font-weight:600}
.scanner .scan-bar{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:#000}
.scanner .scan-bar button{min-height:48px;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;font-size:15px;font-weight:600}
.idrow .btn{flex:none;white-space:nowrap}
.setsec{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.setsec h3{font-size:15px}
.meter{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

#app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto;background:var(--bg)}
.top{display:flex;align-items:center;gap:8px;padding-block:10px;border-bottom:1px solid var(--line);background:var(--band)}
.logo{width:30px;height:30px;border-radius:9px;flex:none;background:
  radial-gradient(circle at 30% 32%,var(--ink) 0 2.6px,transparent 3px),
  radial-gradient(circle at 68% 26%,var(--ink) 0 2px,transparent 2.4px),
  radial-gradient(circle at 56% 62%,var(--ink) 0 3px,transparent 3.4px),
  radial-gradient(circle at 24% 72%,var(--ink) 0 1.8px,transparent 2.2px),
  radial-gradient(circle at 80% 76%,var(--ink) 0 1.6px,transparent 2px),var(--accent)}
.top h1{font-family:var(--f-display);font-weight:700;font-size:18px;margin:0;letter-spacing:.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conn{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--off)}
.conn.on i{background:var(--ok)} .conn.bad i{background:var(--bad)}
@media (max-width:430px){.conn span{display:none}}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:22px;line-height:1;flex:none}
.add-btn{background:var(--primary);color:var(--primary-ink);border-color:transparent;font-weight:700}
.icon-btn svg,.btn svg,.scan-in svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn svg{width:18px;height:18px;vertical-align:-4px;margin-right:4px}
.qbtn{position:relative}
.badge{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font:700 11px/19px var(--f-mono);text-align:center}

main{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.view{padding-block:14px 28px}
#v-chat{height:100%;display:flex;flex-direction:column;padding:0}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface)}
.tabs button{border:0;background:none;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);min-height:52px}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700}
.tabs button[aria-selected="true"] svg{stroke:var(--accent)}

h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance}
.sec-h{display:flex;align-items:baseline;gap:8px;margin:22px 0 8px;font-size:15px;flex-wrap:wrap}
.sec-h:first-child{margin-top:4px}
.sec-h .count{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.banner{margin:12px 0 0;padding:10px 12px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-size:13px}
.infobox{padding:10px 12px;border-radius:var(--r);background:var(--sunk);border:1px solid var(--line);font-size:13.5px;margin-bottom:12px}
.infobox.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}

/* chat */
.msgs{flex:1;min-height:0;overflow:auto;padding-block:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:9px 12px;border-radius:16px;font-size:15px;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:5px;white-space:pre-wrap}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.bot p{margin:0 0 6px}.msg.bot p:last-child{margin:0}
.msg.bot ul{margin:2px 0 6px;padding-left:1.2em}
.msg.err{border-color:var(--bad);color:var(--bad)}
.thinking{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px}
.dots{display:inline-flex;gap:3px}.dots i{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.7}}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.act{font-size:12px;border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:3px 10px}
.idlink{font-family:var(--f-mono);font-size:.92em;border:0;background:var(--accent-soft);color:inherit;border-radius:5px;padding:0 4px;font-weight:600}
.composer{border-top:1px solid var(--line);padding-block:8px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px))}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip.edit{border-style:dashed;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.inrow{display:flex;gap:8px;align-items:flex-end}
.inrow textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);border-radius:20px;padding:9px 14px;background:var(--surface);font-size:16px;line-height:1.4;max-height:140px}
.send{width:42px;height:42px;border-radius:50%;border:0;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;flex:none}
.send svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.send.stop{background:var(--ink);color:var(--bg)}
.scan-in{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;flex:none}
.tier{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.tier button{border:1px solid var(--line);background:none;border-radius:999px;padding:2px 10px;font-size:12px;color:var(--muted)}
.tier button[aria-pressed="true"]{background:var(--sunk);color:var(--ink);border-color:var(--muted)}
.welcome{padding:6px 2px;display:flex;flex-direction:column;gap:10px}
.welcome h2{font-size:20px}
.welcome p{margin:0;color:var(--muted);font-size:14px}
.sesh{display:flex;flex-direction:column;border-top:1px solid var(--line);margin-top:2px}
.sesh-h{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;padding:8px 0 2px}
.sesrow{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 0;font-size:14px;min-width:0}
.sestitle{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sesdate{font-family:var(--f-mono);font-size:12px;color:var(--muted);flex:none}
.sesmore{border:0;background:none;color:var(--accent-ink);font-size:13px;padding:8px 0;text-align:left}

/* lists */
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface);font-size:16px}
.filters{display:flex;flex-direction:column;gap:8px;margin:10px 0 12px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:auto 22px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 12px;min-height:56px}
.row.r3{grid-template-columns:auto minmax(0,1fr) auto}
.row:last-child{border-bottom:0}
.row:active{background:var(--sunk)}
.rid{font-family:var(--f-mono);font-size:13px;font-weight:600;min-width:62px}
.sx{font-size:16px;text-align:center}.sx.m{color:var(--info)}.sx.f{color:var(--bad)}
.rmain{min-width:0;display:flex;flex-direction:column}
.rmorph{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rright{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.rprice{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap;letter-spacing:.02em}
.s-breed{background:var(--info-soft);color:var(--info)} .s-grow{background:var(--accent-soft);color:var(--accent-ink)}
.s-sale{background:var(--ok-soft);color:var(--ok)} .s-hold{background:var(--warn-soft);color:var(--warn)}
.s-sold,.s-off{background:var(--off-soft);color:var(--off)} .s-dead{background:var(--bad-soft);color:var(--bad)}
.grade{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;font:700 12px/1 var(--f-mono);background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.grade.gA{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.grade.gB{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.toggle input{width:18px;height:18px;accent-color:var(--accent);flex:none}

/* breeding */
.toolbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.toolbar .btn{padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px}
.toolbar .btn svg{margin:0;width:22px;height:22px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;min-height:42px}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:transparent}
.btn.dark{background:var(--ink);color:var(--bg);border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px}
.btn.big{min-height:52px;font-size:16px}
.btn:disabled{opacity:.5}
.cards{display:flex;flex-direction:column;gap:8px}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;width:100%;border:0;background:none;padding:0;text-align:left}
.card-top b{font-family:var(--f-mono);font-size:14px}
.days{font-family:var(--f-mono);font-size:13px;font-weight:600;white-space:nowrap}
.days.due{color:var(--warn)} .days.over{color:var(--bad)}
.bar{height:6px;border-radius:3px;background:var(--sunk);margin:9px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.card .meta{font-size:12.5px;color:var(--muted)}
.eggs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.egg{font-family:var(--f-mono);font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:3px 10px}
.egg.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.egg.ng{background:var(--bad-soft);color:var(--bad);border-color:transparent;text-decoration:line-through}

/* sales */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;min-width:0}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.3;overflow-wrap:anywhere}
.tile .v small{font-size:12px;color:var(--muted);font-weight:500;margin-left:2px}
.tile.hl{background:var(--accent-soft);border-color:transparent}
button.tile{font:inherit;color:inherit;width:100%}
.tile.addt{border-style:dashed;color:var(--muted);display:grid;place-items:center;min-height:80px;font-size:14px}
.thumb{width:44px;height:44px;border-radius:8px;overflow:hidden;background:var(--sunk);display:block}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
/* catalog: responsive grid that works on phones and PCs */
.cat-wrap{max-width:1180px;margin:0 auto;padding-block:20px 40px}
.cat-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.cat-head h1{font-family:var(--f-display);font-size:24px;margin:0}
.cat-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.cat-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.cat-photo{aspect-ratio:4/3;background:var(--sunk);display:grid;place-items:center;color:var(--muted);font-size:13px;max-width:100%}
.cat-photo img{width:100%;height:100%;object-fit:cover;display:block}
.cat-more{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--line)}
.cat-more img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.cat-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.cat-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cat-id{font-family:var(--f-mono);font-weight:700;font-size:18px}
.cat-sex{font-size:13px;color:var(--muted)}
.cat-morph{font-weight:700;font-size:15px;line-height:1.35}
.cat-en{font-size:12.5px;color:var(--muted)}

  if ("grade" in c && c.grade !== (cur.grade || "")) parts.push("評価 " + (c.grade || "なし"));
  if ("weight" in c && c.weight != null) parts.push("体重 " + c.weight + "g");
  if (("breeding" in c && c.breeding !== isBreeding(cur)) || ("forSale" in c && c.forSale !== isSale(cur))) parts.push("用途 → " + useLabel({ ...cur, ...c }));
  if ("purchasePrice" in c && c.purchasePrice !== (cur.purchasePrice ?? null)) parts.push("購入価格 " + yen(c.purchasePrice));
  if ("price" in c && c.price !== (cur.price ?? null)) parts.push("販売価格 " + yen(c.price));
  if ("wholesalePrice" in c && c.wholesalePrice !== (cur.wholesalePrice ?? null)) parts.push("卸価格 " + yen(c.wholesalePrice));

/* ---------- subscriptions ---------- */
function setConn(state, text) { const c = $("#conn"); c.className = "conn " + state; $("span", c).textContent = text; }
let rq = 0;

function subscribe(db) {
  const cutoff = addDays(today(), -450);
  const onErr = e => { setConn("bad", "同期エラー"); console.warn(e); };
  const into = (key, after) => snap => { S[key] = new Map(snap.docs.map(d => [d.id, d.data()])); after?.(); schedule(); };
  db.collection("geckos").where("active", "==", true).limit(1000).onSnapshot(into("geckos", () => { S.ready = true; setConn("on", S.geckos.size + "頭"); }), onErr);
  db.collection("pairings").where("date", ">=", cutoff).limit(1000).onSnapshot(into("pairings"), onErr);
  db.collection("clutches").where("layDate", ">=", cutoff).limit(1000).onSnapshot(into("clutches"), onErr);
  db.collection("eggs").where("status", "==", "孵卵中").limit(1000).onSnapshot(into("eggs"), onErr);
  db.collection("printQueue").limit(1000).onSnapshot(into("queue", renderBadge), onErr);
  db.doc("meta/lines").onSnapshot(snap => { S.lines = snap.exists ? (snap.data().items || []) : []; schedule(); }, onErr);
  db.doc("meta/morphs").onSnapshot(snap => { applyMorphs(snap.exists ? snap.data() : null); schedule(); }, onErr);
  db.doc("meta/settings").onSnapshot(snap => { S.settings = snap.exists ? snap.data() : {}; schedule(); }, onErr);
  db.doc("public/catalog").onSnapshot(snap => { S.catalog = snap.exists ? { items: [], ...snap.data() } : { items: [] }; schedule(); if (catalogMode) renderCatalogPage(); }, onErr);
  db.doc("public/shop").onSnapshot(snap => { S.shop = snap.exists ? { items: [], ...snap.data() } : { items: [] }; schedule(); }, onErr);
  db.doc("meta/packing").onSnapshot(snap => { S.packing = snap.exists ? { items: [], ...snap.data() } : { items: [] }; schedule(); }, onErr);
}

  if (!window.jsQR) throw new Error("読み取りの部品を読み込めませんでした。通信を確認して開き直してください");
  const img = await loadImg(file), iw = img.width || img.naturalWidth, ih = img.height || img.naturalHeight;
  for (const max of [1000, 1600, 640]) {
    const sc = Math.min(1, max / Math.max(iw, ih)), c = document.createElement("canvas");
    c.width = Math.round(iw * sc); c.height = Math.round(ih * sc);
    const ctx = c.getContext("2d", { willReadFrequently: true }); ctx.drawImage(img, 0, 0, c.width, c.height);
    const r = jsQR(ctx.getImageData(0, 0, c.width, c.height).data, c.width, c.height, { inversionAttempts: "attemptBoth" });
    if (r && r.data) return r.data;
  }
  return "";
}
function idFromQR(t) {
  if (!t) return "";
  let h = String(t); if (h.includes("#")) h = h.split("#").pop();
  try { h = decodeURIComponent(h); } catch {}
  const id = normId(h); return ID_RE.test(id) ? id : "";
}

/* hatching: scanning any egg opens one screen with a card for every egg of that clutch still incubating.

async function hatchForm(eggId) {
  if (collOf(normId(eggId)) === "clutches") {
    /* the clutch QR: start from its first egg still incubating (older clutches without egg IDs get them now) */
    let c = await getRec("clutches", eggId).catch(() => null);
    if (!c) { toast(normId(eggId) + " という産卵は見つかりません"); return; }
    if (!(c.eggIds || []).length && c.status === "孵卵中") c = await issueEggsForClutch(c.id);
    const first = (await eggsOf(c)).filter(x => x.status === "孵卵中").sort((a, b) => a.id.localeCompare(b.id))[0];
    if (!first) { toast(c.id + " の卵はすべて記録済みです"); openClutch(c.id); return; }

const packItems = () => (S.packing.items || []).slice().sort((a, b) => a.no - b.no);

async function packAdd({ id, no, price }) {

  const g = await getRec("geckos", id); if (!g) throw new Error(normId(id) + " という個体は見つかりません");

  const n = Math.round(toNum(no)), p = toNum(price);

        if (armedRestore !== name) { armedRestore = name; b.textContent = name.replace(".json.gz", "") + " — もう一度で戻す"; return; }
        b.disabled = true; toast("戻しています…");
        try { const r = await BM.backup.restore(name, (n, all) => { b.textContent = `写真 ${n}/${all}`; }); toast(`${r.docs}件のデータと写真${r.photos}枚を戻しました`); S.local.clear(); closeSheet(s); }
        catch (x) { toast(x.message); b.disabled = false; }
        return;
      }
      const a = b.dataset.sx;
      try {
        if (a === "key") { const v = $("#st-key", s.body).value.trim(); if (!v) { toast("APIキーを入力してください"); return; } await BM.settings.set({ apiKey: v }); toast("APIキーを保存しました"); }
        else if (a === "budget") { const v = Math.max(0, Math.round(toNum($("#st-budget", s.body).value) ?? 0)); await BM.settings.set({ budgetYen: v }); toast("予算を保存しました"); }
        else if (a === "gh") { const v = $("#st-gh", s.body).value.trim(); if (!v) { toast("鍵を入力してください"); return; } await BM.settings.set({ ghToken: v }); toast("GitHubの鍵を保存しました"); }
        else if (a === "fx") { b.disabled = true; const v = await BM.budget.refreshFx(true); toast("1ドル＝" + Math.round(v * 100) / 100 + "円に更新しました"); }
        else if (a === "relink") { linkUrl = await BM.backup.startLink(true); toast("もう一度①から進めてください"); }
        else if (a === "code") { const v = $("#st-code", s.body).value.trim(); if (!v) return; b.disabled = true; await BM.backup.finishLink(v); linkUrl = ""; toast("Dropboxとつなぎました"); runBackup(true); }
        else if (a === "now") { b.disabled = true; b.textContent = "バックアップ中…"; await runBackup(true); }
        else if (a === "list") {
          const box = $("#st-restore", s.body); box.innerHTML = `<p class="note">読み込み中…</p>`;
          const names = await BM.backup.listSnapshots();
          box.innerHTML = names.length ? `<p class="note">戻したい日を選んでください。今のiPhoneの台帳は、選んだ日の内容に置き換わります。</p><div class="list">${names.slice(0, 40).map(n => `<button class="row r3" data-rs="${esc(n)}"><span class="rid">${esc(n.replace(".json.gz", ""))}</span><span class="rmain"></span><span class="rsub">戻す</span></button>`).join("")}</div>` : `<p class="note">バックアップがまだありません。</p>`;
          return;
        }
        else if (a === "morphs") { morphSheet(); return; }
        else if (a === "lang-ja" || a === "lang-en") { const v = a.slice(5); await saveMeta("settings", { morphLang: v }); S.settings.morphLang = v; schedule(); toast(v === "en" ? "モルフ名を英語で表示します" : "モルフ名を日本語で表示します"); }
        else if (a === "trash") { trashSheet(); return; }
        else if (a === "own") { const v = $("#st-own", s.body).value.trim(); await saveMeta("settings", { ownBreeder: v }); S.settings.ownBreeder = v; toast(v ? "「" + v + " CB」と印刷します" : "自家繁殖のCBは印刷しません"); }
        else if (a === "b1url") { await navigator.clipboard.writeText(B1_URL); toast("アドレスをコピーしました。Bluefyに貼り付けて開いてください"); return; }
        else if (a === "unlink") { await BM.backup.unlink(); toast("Dropboxとのつなぎを外しました"); }
        else if (a === "export") { await S.dl.save({ filename: "breed-manager_" + today() + ".json", data: new Blob([await BM.data.exportJSON()], { type: "application/json" }) }); return; }
        else if (a === "import") { if (!armedImport) { armedImport = true; b.textContent = "もう一度で読み込む"; return; } armedImport = false; const f = $("#st-file", s.body); f.value = ""; f.click(); return; }
      } catch (x) { if (x?.code !== "declined") toast(x.message || String(x)); }
      draw(s);
    };
  }, refresh: s => { const a = document.activeElement; if (a && a.tagName === "INPUT" && s.el.contains(a)) return; draw(s); } });
}
if ("serviceWorker" in navigator) {
  let reloaded = false;
  navigator.serviceWorker.register("sw.js").then(reg => {
    const watch = w => w && w.addEventListener("statechange", () => { if (w.state === "installed" && navigator.serviceWorker.controller) w.postMessage("skipWaiting"); });
    watch(reg.installing); reg.addEventListener("updatefound", () => watch(reg.installing));
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
  }).catch(e => console.warn("sw", e));
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (reloaded || !sessionStorage.getItem("bm-had-controller")) return; reloaded = true; sessionStorage.setItem("bm-updated", "1"); location.reload(); });
  if (navigator.serviceWorker.controller) sessionStorage.setItem("bm-had-controller", "1");
}
if (sessionStorage.getItem("bm-updated")) { sessionStorage.removeItem("bm-updated"); setTimeout(() => toast("新しい版に更新しました"), 600); }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { maybeAutoBackup(); BM.budget.refreshFx().catch(() => {}); purgeTrash().catch(() => {}); renderStatus(); } });

/* ---------- boot ---------- */
renderChat(false); renderTier(); setTab(["chat", "geckos", "breed", "stock"].includes(S.tab) ? S.tab : "chat");
if (location.hash === "#catalog") enterCatalogMode();
window.addEventListener("hashchange", openFromHash);
(async () => {
  const c = window.claude;
  if (!c?.use) { setConn("bad", "オフライン"); renderChat(false); renderView(); openFromHash(); return; }
  c.use("sample").then(async sm => {
    sample = sm;
    if (sm) { const lim = await sm.limits().catch(() => null); toolsOk = !!lim?.tools; if (lim?.tools?.maxCount) toolMax = lim.tools.maxCount; }
    if (!sample || !toolsOk) $("#chat-in").placeholder = "チャットはこの画面では使えません";
    renderChat(false);
  });
  c.use("downloads").then(d => { S.dl = d; });
  c.use("assets").then(a => { S.assets = a; schedule(); });
  const db = await c.use("db");
  if (!db) { setConn("bad", "未接続"); renderView(); return; }
  S.db = db; setConn("", "読み込み中"); subscribe(db);
  if (S.tab === "stock") refreshSales();
  loadSales().then(s => { S.sales = s; }).catch(() => {});
  openFromHash();
  await renderStatus(); renderChat(false);
  maybeAutoBackup(); BM.budget.refreshFx().catch(() => {}); setTimeout(() => purgeTrash().catch(() => {}), 3000);
})();
</script>
</body>
