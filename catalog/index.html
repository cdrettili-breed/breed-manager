<title>レオパ卸リスト</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* layout: header band, then a responsive card grid (1 column on phones, up to 5 on wide screens); photos open in a viewer */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --band:#E8F5FC; --sunk:#F0F8FD; --ink:#14303F; --muted:#5C7685; --line:#D6E9F3;
  --accent:#36A9DE; --accent-soft:#DDF1FB; --ok:#23805A; --ok-soft:#DCF2E8; --scrim:rgba(10,30,45,.82);
  --f-display:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1A22; --surface:#13242F; --band:#11303F; --sunk:#182E3B; --ink:#E5F2F8; --muted:#8EAAB9; --line:#22394A;
  --accent:#5CC3EF; --accent-soft:#163E52; --ok:#6CCB9C; --ok-soft:#15352A; --scrim:rgba(0,0,0,.88); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1A22; --surface:#13242F; --band:#11303F; --sunk:#182E3B; --ink:#E5F2F8; --muted:#8EAAB9; --line:#22394A;
  --accent:#5CC3EF; --accent-soft:#163E52; --ok:#6CCB9C; --ok-soft:#15352A; --scrim:rgba(0,0,0,.88); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band{background:var(--band);border-bottom:1px solid var(--line)}
.wrap{max-width:1240px;margin:0 auto}
header .wrap{padding-block:22px 18px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,4vw,30px);margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.sub b{font-family:var(--f-mono);color:var(--ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap;padding-block:14px}
.tools input,.tools select{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface);font-size:16px;min-width:0}
.tools input{flex:1 1 220px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main .wrap{padding-block:6px 48px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.photo{aspect-ratio:4/3;background:var(--sunk);display:grid;place-items:center;color:var(--muted);font-size:13px;border:0;padding:0;width:100%;cursor:zoom-in;max-width:100%}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo.none{cursor:default}
.count-badge{position:relative}
.count-badge span{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font:600 12px var(--f-mono);padding:2px 8px;border-radius:999px}
.body{padding:11px 13px 13px;display:flex;flex-direction:column;gap:3px;flex:1}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.id{font-family:var(--f-mono);font-weight:700;font-size:19px}
.sex{font-size:13px;color:var(--muted);white-space:nowrap}
.morph{font-weight:700;font-size:15.5px;line-height:1.35;overflow-wrap:anywhere}
.en{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.foot{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:auto;padding-top:10px;font-size:12.5px;color:var(--muted)}
.price{font-family:var(--f-mono);font-size:19px;font-weight:600;color:var(--ink);white-space:nowrap}
.price.ask{font-family:var(--f-body);font-size:12.5px;font-weight:600}
.empty{padding:48px 20px;text-align:center;color:var(--muted);background:var(--sunk);border:1px dashed var(--line);border-radius:14px}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:17px;margin-bottom:4px}
footer{color:var(--muted);font-size:12px;text-align:center;padding-block:0 32px}
.viewer{position:fixed;inset:0;background:var(--scrim);z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.viewer img{max-width:100%;max-height:78vh;border-radius:10px;display:block}
.viewer .bar{display:flex;gap:10px;align-items:center;color:#fff;font:600 14px var(--f-mono)}
.viewer button{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;min-width:44px;height:44px;padding:0 14px;font-size:16px;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s ease}.card:hover{transform:translateY(-2px)}}
</style>

<header class="band gut"><div class="wrap">
  <div><h1 id="title">卸リスト</h1><p class="sub" id="sub">読み込み中…</p></div>
</div></header>
<main class="gut"><div class="wrap">
  <div class="tools">
    <input id="q" type="search" placeholder="モルフや番号で探す" aria-label="モルフや番号で探す" autocomplete="off">
    <select id="sort" aria-label="並び順">
      <option value="no">番号順</option>
      <option value="morph">モルフ順</option>
      <option value="young">若い順</option>
      <option value="old">月齢が高い順</option>
      <option value="cheap">価格が安い順</option>
      <option value="high">価格が高い順</option>
    </select>
  </div>
  <div class="chips" id="sexes" role="group" aria-label="性別"></div>
  <div id="list"></div>
</div></main>
<footer class="gut">掲載内容は更新時点のものです。在庫状況はお問い合わせください。</footer>
<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="写真"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const yen = n => n == null ? "価格はお問い合わせ" : "¥" + Number(n).toLocaleString("ja-JP");
const monthsOld = b => { if (!b) return null; const d = (Date.now() - new Date(b + "T00:00:00")) / 864e5; return d < 0 ? null : Math.floor(d / 30.44); };
const ageText = b => { const m = monthsOld(b); return m == null ? "" : m < 1 ? "生後" + Math.max(0, Math.round((Date.now() - new Date(b + "T00:00:00")) / 864e5)) + "日" : m < 24 ? m + "か月" : Math.floor(m / 12) + "歳"; };
const sexText = s => s === "♂" ? "♂ オス" : s === "♀" ? "♀ メス" : "性別未判定";
let data = { title: "卸リスト", items: [] }, sexF = "";
function render() {
  const q = $("#q").value.normalize("NFKC").toLowerCase().trim(), sort = $("#sort").value;
  const qn = q.replace(/^no\.?\s*/, "");
  let items = data.items.filter(x => (!sexF || (sexF === "?" ? !["♂", "♀"].includes(x.sex) : x.sex === sexF)) && (!q || String(x.wno) === qn || [x.morph, x.morphEn].join(" ").normalize("NFKC").toLowerCase().includes(q)));
  const cmp = {
    no: (a, b) => (a.wno ?? 0) - (b.wno ?? 0),
    morph: (a, b) => String(a.morph).localeCompare(String(b.morph), "ja") || a.id.localeCompare(b.id),
    young: (a, b) => String(b.birthDate || "").localeCompare(String(a.birthDate || "")),
    old: (a, b) => String(a.birthDate || "9").localeCompare(String(b.birthDate || "9")),
    cheap: (a, b) => (a.price ?? 1e12) - (b.price ?? 1e12),
    high: (a, b) => (b.price ?? -1) - (a.price ?? -1),
  }[sort];
  items = items.slice().sort(cmp);
  $("#list").innerHTML = !data.items.length
    ? `<div class="empty"><b>現在掲載している個体はありません</b>入荷しだい掲載します。</div>`
    : !items.length ? `<div class="empty"><b>条件に合う個体はいません</b>検索や性別の絞り込みを変えてみてください。</div>`
    : `<div class="grid">${items.map(x => {
        const ph = x.photos || [];
        return `<article class="card">
          ${ph.length ? `<button class="photo count-badge" data-ph="${esc(x.wno)}" aria-label="No.${esc(x.wno)} の写真を見る"><img src="${esc(ph[0])}" alt="No.${esc(x.wno)} ${esc(x.morph)}" loading="lazy">${ph.length > 1 ? `<span>${ph.length}枚</span>` : ""}</button>` : `<div class="photo none">写真準備中</div>`}
          <div class="body"><div class="top"><span class="id">No.${esc(x.wno ?? "")}</span><span class="sex">${esc(sexText(x.sex))}</span></div>
            <div class="morph">${esc(x.morph || "—")}</div>${x.morphEn && x.morphEn !== x.morph ? `<div class="en">${esc(x.morphEn)}</div>` : ""}
            <div class="foot"><span>${x.birthDate ? esc(x.birthDate.replace(/-/g, ".")) + " 生まれ" + (ageText(x.birthDate) ? "（" + esc(ageText(x.birthDate)) + "）" : "") : ""}</span><span class="price${x.price == null ? " ask" : ""}">${esc(yen(x.price))}</span></div></div></article>`;
      }).join("")}</div>`;
}
function renderSexes() {
  const has = s => data.items.some(x => s === "?" ? !["♂", "♀"].includes(x.sex) : x.sex === s);
  const opts = [["", "すべて"], ["♂", "♂ オス"], ["♀", "♀ メス"], ["?", "未判定"]].filter(([k]) => !k || has(k));
  $("#sexes").innerHTML = opts.length > 2 ? opts.map(([k, l]) => `<button class="chip" data-sex="${k}" aria-pressed="${sexF === k}">${l}</button>`).join("") : "";
}
let vi = { list: [], i: 0 };
function showViewer() {
  const v = $("#viewer"), src = vi.list[vi.i];
  v.innerHTML = `<img src="${esc(src)}" alt="写真 ${vi.i + 1}"><div class="bar">${vi.list.length > 1 ? `<button data-v="prev" aria-label="前の写真">‹</button><span>${vi.i + 1} / ${vi.list.length}</span><button data-v="next" aria-label="次の写真">›</button>` : ""}<button data-v="close">閉じる</button></div>`;
  v.hidden = false;
}
document.addEventListener("click", e => {
  const s = e.target.closest("[data-sex]"); if (s) { sexF = s.dataset.sex; renderSexes(); render(); return; }
  const p = e.target.closest("[data-ph]"); if (p) { const x = data.items.find(i => String(i.wno) === p.dataset.ph); vi = { list: x.photos || [], i: 0 }; showViewer(); return; }
  const v = e.target.closest("[data-v]");
  if (v) { const k = v.dataset.v; if (k === "close") $("#viewer").hidden = true; else { vi.i = (vi.i + (k === "next" ? 1 : -1) + vi.list.length) % vi.list.length; showViewer(); } return; }
  if (e.target.id === "viewer") $("#viewer").hidden = true;
});
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#viewer").hidden = true; });
$("#q").addEventListener("input", render);
$("#sort").addEventListener("change", render);
fetch("catalog.json", { cache: "no-store" }).then(r => r.ok ? r.json() : Promise.reject(r.status)).then(d => {
  data = { title: "卸リスト", items: [], ...d };
  document.title = (data.title || "卸リスト");
  $("#title").textContent = data.title || "卸リスト";
  $("#sub").innerHTML = `<b>${data.items.length}</b>頭掲載 · ${esc(String(data.updatedAt || "").slice(0, 10).replace(/-/g, "/"))} 更新`;
  renderSexes(); render();
}).catch(() => { $("#sub").textContent = "リストを読み込めませんでした。時間をおいて開き直してください。"; render(); });
</script>
